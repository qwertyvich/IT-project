<polyline points="950,365 950,395 790,395 790,825" fill="none" stroke="black" stroke-width="2"/>
<polyline points="790,470 820,470" fill="none" stroke="black" stroke-width="2"/>
<rect x="820" y="420" width="305" height="112" rx="0" fill="white" stroke="black" stroke-width="2"/>
<text x="972.5" y="468.80" text-anchor="middle" font-family="Arial" font-size="24" fill="black">
<tspan x="972.5" dy="0">F3.1 Подготовить /</tspan>
<tspan x="972.5" dy="26.880000000000003">отменить перевод</tspan>
</text>
<polyline points="790,610 820,610" fill="none" stroke="black" stroke-width="2"/>
<rect x="820" y="560" width="305" height="112" rx="0" fill="white" stroke="black" stroke-width="2"/>
<text x="972.5" y="608.80" text-anchor="middle" font-family="Arial" font-size="24" fill="black">
<tspan x="972.5" dy="0">F3.2 Проверить и</tspan>
<tspan x="972.5" dy="26.880000000000003">провести перевод</tspan>
</text>
<polyline points="790,750 820,750" fill="none" stroke="black" stroke-width="2"/>
<rect x="820" y="700" width="305" height="112" rx="0" fill="white" stroke="black" stroke-width="2"/>
<text x="972.5" y="748.80" text-anchor="middle" font-family="Arial" font-size="24" fill="black">
<tspan x="972.5" dy="0">F3.3 Показать итог и</tspan>
<tspan x="972.5" dy="26.880000000000003">распознать повтор</tspan>
</text>
<polyline points="1330,175 1330,220" fill="none" stroke="black" stroke-width="2"/>
<rect x="1155" y="220" width="350" height="145" rx="12" fill="#FFF2B2" stroke="black" stroke-width="2"/>
<path d="M1167,220 H1493 Q1505,220 1505,232 V257 H1155 V232 Q1155,220 1167,220" fill="#F7A547" stroke="black" stroke-width="2"/>
<text x="1330.0" y="245.50" text-anchor="middle" font-family="Arial" font-size="25" fill="black">
<tspan x="1330.0" dy="0">F4</tspan>
</text>
<text x="1330.0" y="317.50" text-anchor="middle" font-family="Arial" font-size="25" fill="black">
<tspan x="1330.0" dy="0">Вести кредитные договоры</tspan>
</text>
<polyline points="1330,365 1330,395 1170,395 1170,825" fill="none" stroke="black" stroke-width="2"/>
<polyline points="1170,470 1200,470" fill="none" stroke="black" stroke-width="2"/>
<rect x="1200" y="420" width="305" height="112" rx="0" fill="white" stroke="black" stroke-width="2"/>
<text x="1352.5" y="468.80" text-anchor="middle" font-family="Arial" font-size="24" fill="black">
<tspan x="1352.5" dy="0">F4.1 Проверить условия</tspan>
<tspan x="1352.5" dy="26.880000000000003">договора</tspan>
</text>
<polyline points="1170,610 1200,610" fill="none" stroke="black" stroke-width="2"/>
<rect x="1200" y="560" width="305" height="112" rx="0" fill="white" stroke="black" stroke-width="2"/>
<text x="1352.5" y="608.80" text-anchor="middle" font-family="Arial" font-size="24" fill="black">
<tspan x="1352.5" dy="0">F4.2 Построить и</tspan>
<tspan x="1352.5" dy="26.880000000000003">сохранить график</tspan>
</text>
<polyline points="1170,750 1200,750" fill="none" stroke="black" stroke-width="2"/>
<rect x="1200" y="700" width="305" height="112" rx="0" fill="white" stroke="black" stroke-width="2"/>
<text x="1352.5" y="748.80" text-anchor="middle" font-family="Arial" font-size="24" fill="black">
<tspan x="1352.5" dy="0">F4.3 Закрыть договор по</tspan>
<tspan x="1352.5" dy="26.880000000000003">основанию</tspan>
</text>
<polyline points="1710,175 1710,220" fill="none" stroke="black" stroke-width="2"/>
<rect x="1535" y="220" width="350" height="145" rx="12" fill="#FFF2B2" stroke="black" stroke-width="2"/>
<path d="M1547,220 H1873 Q1885,220 1885,232 V257 H1535 V232 Q1535,220 1547,220" fill="#F7A547" stroke="black" stroke-width="2"/>
<text x="1710.0" y="245.50" text-anchor="middle" font-family="Arial" font-size="25" fill="black">
<tspan x="1710.0" dy="0">F5</tspan>
</text>
<text x="1710.0" y="303.50" text-anchor="middle" font-family="Arial" font-size="25" fill="black">
<tspan x="1710.0" dy="0">Выдавать сведения и</tspan>
<tspan x="1710.0" dy="28.000000000000004">отчёты</tspan>
</text>
<polyline points="1710,365 1710,395 1550,395 1550,825" fill="none" stroke="black" stroke-width="2"/>
<polyline points="1550,470 1580,470" fill="none" stroke="black" stroke-width="2"/>
<rect x="1580" y="420" width="305" height="112" rx="0" fill="white" stroke="black" stroke-width="2"/>
<text x="1732.5" y="468.80" text-anchor="middle" font-family="Arial" font-size="24" fill="black">
<tspan x="1732.5" dy="0">F5.1 Выдать документы</tspan>
<tspan x="1732.5" dy="26.880000000000003">и результаты</tspan>
</text>
<polyline points="1550,610 1580,610" fill="none" stroke="black" stroke-width="2"/>
<rect x="1580" y="560" width="305" height="112" rx="0" fill="white" stroke="black" stroke-width="2"/>
<text x="1732.5" y="608.80" text-anchor="middle" font-family="Arial" font-size="24" fill="black">
<tspan x="1732.5" dy="0">F5.2 Свести карты,</tspan>
<tspan x="1732.5" dy="26.880000000000003">переводы и кредиты</tspan>
</text>
<polyline points="1550,750 1580,750" fill="none" stroke="black" stroke-width="2"/>
<rect x="1580" y="700" width="305" height="112" rx="0" fill="white" stroke="black" stroke-width="2"/>
<text x="1732.5" y="748.80" text-anchor="middle" font-family="Arial" font-size="24" fill="black">
<tspan x="1732.5" dy="0">F5.3 Показать аудит и</tspan>
<tspan x="1732.5" dy="26.880000000000003">сверку</tspan>
</text>
<text x="950" y="901.24" text-anchor="middle" font-family="Arial" font-size="24" fill="black">
<tspan x="950" dy="0">Каждый лист имеет вход, результат и проверку; порядок исполнения раскрывается процессной моделью.</tspan>
</text></svg>