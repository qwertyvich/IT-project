<tspan x="1400" dy="0">PK — ключ; FK — ссылка; UQ — уникальность. FK → PK: у дочерней записи 1 родитель, у родителя 0..N записей.</tspan>
</text>
<text x="1400" y="1930.92" text-anchor="middle" font-family="Arial" font-size="42" fill="black">
<tspan x="1400" dy="0">entity_id аудита — идентификатор объекта без общего FK. Пересечение линий без узла не создаёт отношения.</tspan>
