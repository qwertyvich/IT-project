<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="1450" viewBox="0 0 2600 1450"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 4 L 0 8" fill="none" stroke="black" stroke-width="1.7"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="30" y="60" width="720" height="230" rx="12" fill="#A4C8EA" stroke="black" stroke-width="2"/>
<text x="390.0" y="109.66" text-anchor="middle" font-family="Arial" font-size="33" fill="black">
<tspan x="390.0" dy="0">Организатор: руководитель</tspan>
<tspan x="390.0" dy="36.96">операционного направления банка</tspan>
<tspan x="390.0" dy="36.96"></tspan>
<tspan x="390.0" dy="36.96">Нужен завершённый результат</tspan>
<tspan x="390.0" dy="36.96">при ограниченном ресурсе</tspan>
</text>
<rect x="940" y="60" width="720" height="230" rx="12" fill="#FFF2B2" stroke="black" stroke-width="2"/>
<text x="1300.0" y="128.14" text-anchor="middle" font-family="Arial" font-size="33" fill="black">
<tspan x="1300.0" dy="0">БП-01: системное противоречие</tspan>
<tspan x="1300.0" dy="36.96"></tspan>
<tspan x="1300.0" dy="36.96">Больше ручных сверок → больше труда</tspan>
<tspan x="1300.0" dy="36.96">Меньше проверок → больше риска</tspan>
</text>
<rect x="1850" y="60" width="720" height="230" rx="12" fill="#D9EAD3" stroke="black" stroke-width="2"/>
<text x="2210.0" y="128.14" text-anchor="middle" font-family="Arial" font-size="33" fill="black">
<tspan x="2210.0" dy="0">Назначение системы</tspan>
<tspan x="2210.0" dy="36.96"></tspan>
<tspan x="2210.0" dy="36.96">Верное завершение обращения</tspan>
<tspan x="2210.0" dy="36.96">с меньшим удельным ручным трудом</tspan>
</text>
<rect x="1850" y="580" width="720" height="260" rx="12" fill="#FFF2B2" stroke="black" stroke-width="2"/>
<text x="2210.0" y="644.66" text-anchor="middle" font-family="Arial" font-size="33" fill="black">
<tspan x="2210.0" dy="0">Г0: согласованная автоматизация</tspan>
<tspan x="2210.0" dy="36.96"></tspan>
<tspan x="2210.0" dy="36.96">Повторяемые действия — программе</tspan>
<tspan x="2210.0" dy="36.96">Решения и ответственность — людям</tspan>
<tspan x="2210.0" dy="36.96">Границы процесса сохраняются</tspan>
</text>
<rect x="940" y="580" width="720" height="260" rx="12" fill="#D9EAD3" stroke="black" stroke-width="2"/>
<text x="1300.0" y="644.66" text-anchor="middle" font-family="Arial" font-size="33" fill="black">
<tspan x="1300.0" dy="0">Целевые свойства результата</tspan>
<tspan x="1300.0" dy="36.96"></tspan>
<tspan x="1300.0" dy="36.96">QБ=30 из 30; критических нарушений=0</tspan>
<tspan x="1300.0" dy="36.96">u=L/Q; uБ≤0,80uА</tspan>
<tspan x="1300.0" dy="36.96">Состав исполнителей одинаков</tspan>
</text>
<rect x="30" y="580" width="720" height="260" rx="12" fill="#A4C8EA" stroke="black" stroke-width="2"/>
<text x="390.0" y="644.66" text-anchor="middle" font-family="Arial" font-size="33" fill="black">
<tspan x="390.0" dy="0">Приёмка заказчиком</tspan>
<tspan x="390.0" dy="36.96"></tspan>
<tspan x="390.0" dy="36.96">Контрольный профиль А/Б</tspan>
<tspan x="390.0" dy="36.96">Свидетельства И01–И25</tspan>
<tspan x="390.0" dy="36.96">Решение с явными основаниями</tspan>
</text>
<polyline points="750,175 940,175" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="1660,175 1850,175" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="2210,290 2210,580" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="1850,710 1660,710" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="940,710 750,710" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="1060" width="2540" height="230" rx="0" fill="#FFFFFF" stroke="black" stroke-width="2"/>
<text x="1300.0" y="1146.62" text-anchor="middle" font-family="Arial" font-size="33" fill="black">
<tspan x="1300.0" dy="0">Состав решения: деятельность банка → система с людьми и регламентом → программный продукт → модули.</tspan>
<tspan x="1300.0" dy="36.96">Основной результат — правильно завершённое обращение с подтверждающим документом и согласованным учётом.</tspan>
<tspan x="1300.0" dy="36.96">Норма сокращения труда 20 % проверяется на одинаковом профиле обращений до приёмки.</tspan>
</text>
